<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splendida Nam — Scegli la lingua / Choose your language</title>
<meta name="description" content="I giochi di matematica di Nam. Scegli la lingua — Nam's maths games. Choose your language.">
<meta name="theme-color" content="#EFEBE1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="alternate" hreflang="it" href="/it/">
<link rel="alternate" hreflang="en" href="/en/">
<link rel="alternate" hreflang="x-default" href="/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#EFEBE1; --paper-2:#E4DFD2; --card:#FFFFFF;
  --ink:#16324F; --ink-2:#5B7186; --rule:#CBC4B4;
  --coral:#F2653F; --mint:#149B7C; --violet:#7C5CFF;
  --pink:#F45D9E; --amber:#F5A524; --sky:#3D9BE9; --lime:#66A80F;
  --display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --body:'Nunito', ui-rounded, system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--body); color:var(--ink); min-height:100vh;
  background:
    repeating-linear-gradient(0deg,transparent 0 27px,rgba(22,50,79,.045) 27px 28px),
    linear-gradient(180deg,var(--paper),var(--paper-2));
  padding:24px 16px 40px;
  display:flex; align-items:center; justify-content:center;
  overflow-x:hidden;
}
#app{width:100%; max-width:620px; position:relative; z-index:1}

/* ---------- decorazioni ---------- */
.blobs{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.blob{position:absolute; border-radius:50%; filter:blur(48px); opacity:.30}
.b1{width:340px;height:340px; background:var(--pink);  top:-120px; left:-110px}
.b2{width:300px;height:300px; background:var(--sky);   top:22%;    right:-130px}
.b3{width:320px;height:320px; background:var(--amber); bottom:-140px; left:12%}

/* ---------- hero ---------- */
.hero{text-align:center; margin:0 0 6px}
.brand{display:inline-flex; align-items:center; gap:9px; background:var(--card); border:2.5px solid var(--ink);
  border-radius:999px; padding:6px 14px 6px 8px; box-shadow:0 3px 0 var(--ink)}
.brand .dot{width:24px;height:24px;border-radius:50%; background:var(--coral); border:2.5px solid var(--ink);
  display:grid; place-items:center; font-size:12px}
.brand span{font-size:12px; font-weight:800; letter-spacing:.6px; text-transform:uppercase}

.hello{font-family:var(--display); font-weight:800; letter-spacing:-1.5px; margin:22px 0 0;
  font-size:clamp(38px,11vw,68px); line-height:.96}
.hello .name{
  position:relative; display:inline-block; padding:0 .06em;
  background:linear-gradient(180deg,transparent 62%, rgba(244,93,158,.42) 62%);
}
.hello .name::after{content:'\2728'; position:absolute; top:-.32em; right:-.55em; font-size:.34em;
  animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(1.25) rotate(14deg);opacity:.65}}

.ask{margin:20px auto 0; max-width:30ch; display:flex; flex-direction:column; gap:5px}
.ask p{margin:0; font-size:15.5px; font-weight:800; line-height:1.45}
.ask p.en{color:var(--ink-2); font-style:italic}

/* ---------- scelta lingua ---------- */
.pick{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:26px 0 0}
@media (max-width:460px){ .pick{grid-template-columns:1fr} }

.lang{
  --accent:var(--coral);
  position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;
  background:var(--card); border:3px solid var(--ink); border-radius:22px;
  padding:22px 16px 18px; text-decoration:none; color:inherit;
  box-shadow:0 6px 0 var(--ink);
  transition:transform .16s ease, box-shadow .16s ease;
  overflow:hidden;
}
.lang::before{content:''; position:absolute; top:-50px; right:-50px; width:130px; height:130px;
  border-radius:50%; background:var(--accent); opacity:.16}
.lang:hover,.lang:focus-visible{transform:translateY(-4px); box-shadow:0 10px 0 var(--ink); outline:none}
.lang:active{transform:translateY(2px); box-shadow:0 3px 0 var(--ink)}
.lang:focus-visible{border-color:var(--accent)}

.flag{width:62px; height:62px; border-radius:18px; border:3px solid var(--ink);
  box-shadow:0 3px 0 var(--ink); overflow:hidden; position:relative}
.flag svg{width:100%; height:100%; display:block}
.lang h2{font-family:var(--display); font-weight:800; font-size:24px; margin:4px 0 0; letter-spacing:-.4px}
.lang .sub{font-size:12.5px; font-weight:800; color:var(--ink-2); letter-spacing:.3px; text-align:center; line-height:1.4}
.lang .go{margin-top:6px; display:flex; align-items:center; gap:6px;
  font-size:12px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--accent)}
.lang .go svg{width:15px;height:15px; transition:transform .16s ease}
.lang:hover .go svg{transform:translateX(4px)}

/* ---------- footer ---------- */
footer{margin-top:30px; text-align:center; font-size:12.5px; font-weight:800; color:var(--ink-2); line-height:1.7}
footer .heart{color:var(--pink)}

/* ---------- entrata ---------- */
.rise{opacity:0; transform:translateY(14px); animation:rise .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes rise{to{opacity:1; transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
  .rise{opacity:1; transform:none}
}
</style>
</head>
<body>

<div class="blobs" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<main id="app">

  <section class="hero">
    <div class="rise" style="animation-delay:.02s">
      <div class="brand"><span class="dot">&#127922;</span><span>Giochi di matematica &middot; Maths games</span></div>
    </div>

    <h1 class="hello rise" style="animation-delay:.08s">Ciao,<br><span class="name">Nam</span></h1>

    <div class="ask rise" style="animation-delay:.14s">
      <p lang="it">Clicca sulla tua lingua per entrare!</p>
      <p lang="en" class="en">Click on your language to come in!</p>
    </div>
  </section>

  <div class="pick">

    <a class="lang rise" style="--accent:var(--mint); animation-delay:.20s" href="it/" lang="it" hreflang="it">
      <span class="flag" aria-hidden="true">
        <svg viewBox="0 0 30 20"><rect width="10" height="20" fill="#149B7C"/><rect x="10" width="10" height="20" fill="#F7F5EF"/><rect x="20" width="10" height="20" fill="#F2653F"/></svg>
      </span>
      <h2>Italiano</h2>
      <span class="sub">Giochiamo in italiano</span>
      <span class="go">Entra <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="lang rise" style="--accent:var(--sky); animation-delay:.26s" href="en/" lang="en" hreflang="en">
      <span class="flag" aria-hidden="true">
        <svg viewBox="0 0 30 20">
          <rect width="30" height="20" fill="#1B3A78"/>
          <path d="M0 0 30 20M30 0 0 20" stroke="#F7F5EF" stroke-width="4"/>
          <path d="M0 0 30 20M30 0 0 20" stroke="#D63B3B" stroke-width="2"/>
          <path d="M15 0v20M0 10h30" stroke="#F7F5EF" stroke-width="6"/>
          <path d="M15 0v20M0 10h30" stroke="#D63B3B" stroke-width="3.4"/>
        </svg>
      </span>
      <h2>English</h2>
      <span class="sub">Let&rsquo;s play in English</span>
      <span class="go">Enter <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
    </a>

  </div>

  <footer class="rise" style="animation-delay:.34s">
    Fatto con <span class="heart">&hearts;</span> per Nam<br>
    Made with <span class="heart">&hearts;</span> for Nam
  </footer>

</main>

</body>
</html>
